name: Deploy

on:
  workflow_dispatch:

env:
  PROJECT_ID: YOUR_PROJECT_ID
  REGION: YOUR_REGION
  SERVICE: explainit1
  IMAGE: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/explainit1/explainit1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/YOUR_GITHUB_POOL/providers/YOUR_GITHUB_PROVIDER
          service_account: YOUR_DEPLOYER_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --port 8080 \
            --min-instances 0 \
            --max-instances 3 \
            --cpu-boost \
            --execution-environment gen2 \
            --allow-unauthenticated \
            --quiet
